name: Build update tool

on:
  push:
    branches: [main]
    paths: ["updater/**", ".github/workflows/build-updater.yml"]
    tags: ["updater-v*"]
  pull_request:
    paths: ["updater/**", ".github/workflows/build-updater.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r updater/requirements-build.txt

      - name: Test
        run: python -m pytest updater/tests -q

      - name: Build single exe
        working-directory: updater
        run: >
          pyinstaller --onefile --console --clean --noconfirm
          --name "The Divergence Update Tool"
          --icon assets/icon.ico
          divergence_updater.py

      - name: Smoke test the exe
        working-directory: updater
        shell: pwsh
        run: |
          & ".\dist\The Divergence Update Tool.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-FileHash ".\dist\The Divergence Update Tool.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: The-Divergence-Update-Tool
          path: updater/dist/The Divergence Update Tool.exe

      - name: Attach to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/updater-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "updater/dist/The Divergence Update Tool.exe" --title "Update tool ${{ github.ref_name }}" --notes "The Divergence Update Tool. Drop it into your The Divergence folder and run it."

      # Stable public download link, refreshed on every build of main:
      # https://github.com/OzrielTheLost/The-Divergence/releases/download/updater-latest/The-Divergence-Update-Tool.exe
      - name: Publish to the updater-latest release (main or manual run)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "updater/dist/The Divergence Update Tool.exe" "The-Divergence-Update-Tool.exe"
          gh release view updater-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create updater-latest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --latest `
              --title "The Divergence Update Tool" `
              --notes "Download The-Divergence-Update-Tool.exe, put it in your The Divergence folder (any version) and run it. Pick Install for a fresh install."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload updater-latest The-Divergence-Update-Tool.exe --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit 1 }
